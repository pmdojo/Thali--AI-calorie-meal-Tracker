<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" role="img" aria-label="Thali — AI nutrition coach for Indian meals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#EEE9F5"/>
      <stop offset="55%" stop-color="#F7F4EE"/>
      <stop offset="100%" stop-color="#FBD9C7"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C6BF0"/>
      <stop offset="100%" stop-color="#E86B3F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1400" height="480" fill="url(#bg)"/>

  <!-- Soft blobs -->
  <circle cx="1180" cy="120" r="120" fill="#C7BEFB" opacity="0.55" filter="url(#soft)"/>
  <circle cx="1280" cy="380" r="90"  fill="#FBD9C7" opacity="0.70" filter="url(#soft)"/>

  <!-- Wordmark -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="1.5" fill="#7C6BF0">THALI</text>
    <text x="0" y="110" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="78" font-weight="800" fill="#1F1B2E" letter-spacing="-1.5">
      The nutrition coach
    </text>
    <text x="0" y="200" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="78" font-weight="800" fill="#1F1B2E" letter-spacing="-1.5">
      that speaks <tspan fill="#E86B3F">your food.</tspan>
    </text>
    <text x="0" y="260" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#6B6478">
      Calibrated for mixed home-cooked Indian meals — not just plated Western photography.
    </text>
    <text x="0" y="292" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#1F1B2E">
      One better choice at a time, not a lecture.
    </text>
  </g>

  <!-- Plate + ring illustration on the right -->
  <g transform="translate(1050, 240)">
    <!-- outer plate -->
    <circle cx="0" cy="0" r="170" fill="#FFFFFF" stroke="#E5DFD3" stroke-width="2"/>
    <!-- ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#EEE9F5" stroke-width="18"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#ring)" stroke-width="18"
            stroke-dasharray="754"
            stroke-dashoffset="203"
            stroke-linecap="round"
            transform="rotate(-90)"/>
    <!-- inner label -->
    <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#1F1B2E">1231</text>
    <text x="0" y="26" text-anchor="middle" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#6B6478">kcal remaining</text>
    <!-- macro dots -->
    <circle cx="-90" cy="130" r="8" fill="#7C6BF0"/>
    <text x="-76" y="135" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="14" fill="#1F1B2E">Protein</text>
    <circle cx="-4" cy="130" r="8" fill="#E8B54E"/>
    <text x="10" y="135" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="14" fill="#1F1B2E">Carbs</text>
    <circle cx="70" cy="130" r="8" fill="#E86B3F"/>
    <text x="84" y="135" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="14" fill="#1F1B2E">Fat</text>
  </g>
</svg>
