<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" role="img" aria-label="Thali — AI nutrition coach for Indian meals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#F8ECD6"/>
      <stop offset="52%" stop-color="#F3DCBE"/>
      <stop offset="100%" stop-color="#EBC99C"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E39A57"/>
      <stop offset="100%" stop-color="#C26E2E"/>
    </linearGradient>
    <radialGradient id="dal" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFD84F"/>
      <stop offset="100%" stop-color="#EE951B"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1400" height="480" fill="url(#bg)"/>

  <!-- Soft warm blobs -->
  <circle cx="1180" cy="110" r="130" fill="#F2C79A" opacity="0.55" filter="url(#soft)"/>
  <circle cx="1290" cy="380" r="95"  fill="#E9CFA6" opacity="0.65" filter="url(#soft)"/>

  <!-- Wordmark + headline (serif display) -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="2" fill="#C26E2E">THALI</text>
    <text x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="800" fill="#3A2E1D" letter-spacing="-1">
      The nutrition coach
    </text>
    <text x="0" y="202" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="800" fill="#3A2E1D" letter-spacing="-1">
      that speaks <tspan fill="#C26E2E">your food.</tspan>
    </text>
    <text x="0" y="262" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8A7B66">
      Calibrated for mixed home-cooked Indian meals — not just plated Western photography.
    </text>
    <text x="0" y="294" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#3A2E1D">
      One better choice at a time, not a lecture.
    </text>
  </g>

  <!-- Calorie ring on the right -->
  <g transform="translate(1050, 240)">
    <!-- outer plate -->
    <circle cx="0" cy="0" r="170" fill="#FCF4E9" stroke="rgba(120,90,50,0.14)" stroke-width="2"/>
    <!-- ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#F5E1C6" stroke-width="18"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#ring)" stroke-width="18"
            stroke-dasharray="754"
            stroke-dashoffset="203"
            stroke-linecap="round"
            transform="rotate(-90)"/>
    <!-- clay-thali dots at the centre -->
    <circle cx="0" cy="-46" r="7" fill="url(#dal)"/>
    <circle cx="16" cy="16" r="7" fill="#6FA83E"/>
    <circle cx="-16" cy="18" r="7" fill="#F1E7D2"/>
    <!-- inner label -->
    <text x="0" y="-4" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="800" fill="#3A2E1D">1231</text>
    <text x="0" y="26" text-anchor="middle" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#8A7B66">kcal remaining</text>
    <!-- macro dots -->
    <circle cx="-90" cy="132" r="8" fill="#DD8A46"/>
    <text x="-76" y="137" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="14" fill="#3A2E1D">Protein</text>
    <circle cx="-4" cy="132" r="8" fill="#B58A3A"/>
    <text x="10" y="137" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="14" fill="#3A2E1D">Carbs</text>
    <circle cx="70" cy="132" r="8" fill="#B5714B"/>
    <text x="84" y="137" font-family="-apple-system, Inter, Helvetica, sans-serif" font-size="14" fill="#3A2E1D">Fat</text>
  </g>
</svg>
